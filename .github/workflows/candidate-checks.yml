name: Candidate checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install test dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check generated policies and release archive
        run: |
          python3 ../tools/render-policies.py
          git diff --exit-code
          python3 ../tools/package-extension.py . "$RUNNER_TEMP/courselark-review.zip"
      - name: Unit tests
        run: npm test
      - name: Browser and unpacked-extension tests
        env:
          CAMPUS_PAIRING_TOKEN: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        run: |
          node server.mjs > "$RUNNER_TEMP/courselark-companion.log" 2>&1 &
          companion_pid=$!
          trap 'kill "$companion_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4317/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4317/ > /dev/null
          npm run test:browser
          npm run test:extension
